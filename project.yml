name: ThingCost
options:
  bundleIdPrefix: com.ufukozdemir
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 99H9NJ6Z6J
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  ThingCost:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: ThingCostWidget
        embed: true
    entitlements:
      path: Sources/ThingCost.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ufukozdemir.thingcost
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ThingCost
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ufukozdemir.thingcost

  ThingCostWidget:
    type: app-extension
    platform: iOS
    sources:
      - ThingCostWidget
      - path: Sources/Models/Item.swift
      - path: Sources/Shared/SharedStore.swift
    entitlements:
      path: ThingCostWidget/ThingCostWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ufukozdemir.thingcost
    info:
      path: ThingCostWidget/Info.plist
      properties:
        CFBundleDisplayName: ThingCost
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ufukozdemir.thingcost.widget
        SKIP_INSTALL: YES

  ThingCostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ThingCost

  ThingCostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ThingCost

schemes:
  ThingCost:
    build:
      targets:
        ThingCost: all
        ThingCostTests: [test]
        ThingCostUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Resources/Store.storekit
    test:
      targets:
        - ThingCostTests
        - ThingCostUITests
